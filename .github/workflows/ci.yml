name: Django CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create dummy .env file
        run: |
          echo "SECRET_KEY=django-insecure-ci-test-key-value" > .env
          echo "GOOGLE_CLIENT_ID=dummy-client-id" >> .env
          echo "GOOGLE_CLIENT_SECRET=dummy-secret" >> .env
          echo "KAKAO_MAP_API_KEY=dummy-map-key" >> .env

      - name: Start Database and Redis services
        run: |
          docker compose up -d db redis

      - name: Wait for PostgreSQL to be ready
        run: |
          until docker compose exec -T db pg_isready -U meetu_user -d meetu; do
            echo "Waiting for PostgreSQL database to be ready..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run Tests
        run: |
          docker compose run --rm web python manage.py test

      - name: Clean up containers
        run: |
          docker compose down
